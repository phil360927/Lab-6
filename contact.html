<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Taste of Taiwan</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="navbar md:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    Taste of Taiwan
                </a>

                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"  data-bs-target="#navbarNavMenu"  aria-controls="navbarNavMenu"
                        aria-expanded="false"  aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"  aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" tabindex="-1"  id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">

                    <div class="drawer-header">
                        <h2 class="drawer-title" id="navbarNavMenuLabel"> Menu </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer"  aria-label="Close"> </button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav">

                            <li class="nav-item">
                                <a class="nav-link" href="index.html">  Home  </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"href="index.html#food-tours"> Food Tours </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active"   aria-current="page"  href="contact.html">  Contact  </a>
                            </li>
             </ul>
           </div>
         </dialog>
        </div>
    </nav>
    </header>

    <main class="container my-5">
        <h1>Contact Us</h1>
        <p> Interested in exploring Taiwan's food culture? Have questions about local dishes or food tours? Send us a message! </p>
        <section class="my-5">
            <h2>Food Tour Inquiry</h2>
            <form action="#" method="get">
                <div class="row g-4">
                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="firstName"> First Name </label>
                            <input type="text" class="form-control"  id="firstName"  name="firstName" required>
                        </div>
                    </div>
                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="lastName"> Last Name </label>
                            <input type="text"  class="form-control"  id="lastName"  name="lastName"  required>
                        </div>
                    </div>
                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="email">  Email Address  </label>
                            <input type="email"  class="form-control" id="email"  name="email"  placeholder="name@example.com"   required>
                        </div>
                    </div>
                    <div class="col-12 md:col-6">
                        <div class="form-field">

                            <label for="inquiryType"> Inquiry Type </label>
                            <select class="form-control" id="inquiryType"  name="inquiryType"  required>
                                <option value="">  Choose an option  </option>
                                <option value="food-tour">  Food Tour  </option>
                                <option value="recommendations">  Food Recommendations  </option>
                                <option value="general"> General Inquiry </option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <label for="message"> Your Message </label>
                            <textarea class="form-control"  id="message"  name="message" rows="5"  required></textarea>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-field">
                            <input type="checkbox" id="consent" name="consent"class="check" required>
                            <label for="consent">  I agree to be contacted regarding my inquiry. </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit"  class="btn-solid theme-primary"> Submit Inquiry </button>
                    </div>
                </div>
            </form>
        </section>
    </main>
    <footer class="container my-5">
        <p>  &copy; 2026 Taste of Taiwan. </p>
    </footer>
    <script type="module"
            src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
